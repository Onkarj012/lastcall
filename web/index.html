<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lastcall</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <span class="mark">last<span>call</span></span>
  <div class="right">
    <span class="dot" id="dot"></span><span id="status">Connecting…</span>
    <button class="btn" id="add" title="Log in a new account">+ Account</button>
    <button class="btn" id="refresh" title="Fetch quota now"><svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>Refresh</button>
  </div>
</header>
<div class="banner" id="banner"></div>
<main id="v-usage">
  <section class="totals" id="totals"></section>
  <section class="subs"><div class="h">Subscriptions</div><div class="grid" id="subs"></div></section>
</main>
<div class="stamp"><span><b>◆ lastcall</b> usage snapshot</span><span id="stamp"></span></div>
<script src="logos.js"></script>
<script src="app.js"></script>
</body>
</html>
